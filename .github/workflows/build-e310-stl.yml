name: Export detailed E310 STEP to binary STL and ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'cad/E310_v30/ANTSDR_E310_photo_corrected_v30.step'
      - 'cad/E310_v30/export_step_to_stl.py'
      - '.github/workflows/build-e310-stl.yml'
permissions:
  contents: write
jobs:
  build-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCascade Python bindings
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery-ocp
      - name: Convert STEP and validate STL and ZIP
        run: python cad/E310_v30/export_step_to_stl.py
      - name: Commit binary artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f cad/E310_v30/ANTSDR_E310_photo_corrected_v30.stl cad/E310_v30/ANTSDR_E310_v30_CAD_bundle.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Export detailed E310 STEP as binary STL and ZIP [skip ci]'
            git push origin HEAD:main
          fi
