name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '04-Android/ANTSDR-Android/**'
      - '.github/workflows/antsdr-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-Android/ANTSDR-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTSDR-Mobile-debug-APK
          path: 04-Android/ANTSDR-Android/app/build/outputs/apk/debug/app-debug.apk
